name: Build and Test

on:
  workflow_dispatch:
  push:
    paths:
      - "Package.swift"
      - "Sources/**"
      - "Tests/**"
      - ".github/workflows/build_and_test.yml"
  pull_request:
    paths:
      - "Package.swift"
      - "Sources/**"
      - "Tests/**"
      - ".github/workflows/build_and_test.yml"

permissions:
  contents: read

env:
  DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer

jobs:
  iOS:
    name: Build and test on iOS
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Test
        run: xcodebuild test -scheme WhatsNewKit -destination 'platform=iOS Simulator,name=iPhone 17,OS=26.5'
  macOS:
    name: Build and test on macOS
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Test
        run: swift test
  visionOS:
    name: Build on visionOS
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Build
        run: xcodebuild build -scheme WhatsNewKit -destination 'generic/platform=visionOS Simulator' CODE_SIGNING_ALLOWED=NO
